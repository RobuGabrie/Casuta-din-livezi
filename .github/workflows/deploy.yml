name: Check & deploy

# Every push to main: lint and type-check, build the image, push it to GHCR, then
# update the server over SSH. Pull requests only run the checks. See docs/deploy.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/robugabrie/casuta-din-livezi

jobs:
  check:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

  image:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://casutadinlivezi.ro' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: image
    # Off until the server and secrets are ready: set the repository variable
    # DEPLOY_ENABLED to "true" (Settings → Secrets and variables → Actions → Variables).
    if: vars.DEPLOY_ENABLED == 'true'
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Copy the compose file to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: deploy/docker-compose.yml
          target: casuta-din-livezi
          strip_components: 1

      - name: Write settings, pull the image and restart
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SITE_URL: ${{ vars.SITE_URL || 'https://casutadinlivezi.ro' }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,SITE_URL,CLOUDFLARE_TUNNEL_TOKEN,CALLMEBOT_APIKEY,SMTP_USER,SMTP_PASS
          script: |
            set -e
            cd ~/casuta-din-livezi
            umask 077
            cat > .env <<ENV
            SITE_URL=$SITE_URL
            CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
            CALLMEBOT_APIKEY=$CALLMEBOT_APIKEY
            CALLMEBOT_PHONE=40751425215
            SMTP_HOST=smtp.gmail.com
            SMTP_PORT=465
            SMTP_USER=$SMTP_USER
            SMTP_PASS=$SMTP_PASS
            NOTIFY_EMAIL=robumihaela69@gmail.com
            ENV
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            sleep 20
            docker compose ps
            docker compose logs --tail 20 web
